name: Feature Request
description: Suggest an idea or enhancement for PC Tweak.
title: "[FEATURE]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        We appreciate suggestions to enhance system performance, latency, and gaming optimizations!
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a specific problem or latency bottleneck?
    validations:
      required: true
  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed Solution
      description: Describe the solution or new feature you would like to see.
    validations:
      required: true
  - type: textarea
    id: anticheat_impact
    attributes:
      label: Anti-Cheat & Safety Considerations
      description: Does this feature involve Windows services, drivers, or registry entries that could interact with Vanguard, EAC, or BattlEye?
    validations:
      required: false
