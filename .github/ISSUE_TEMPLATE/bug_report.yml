name: Bug Report
description: Report a bug, crash, or unexpected behavior in PC Tweak.
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much detail as possible.
  - type: input
    id: os_version
    attributes:
      label: Windows Version & Build
      description: e.g. Windows 11 24H2 (Build 26100)
      placeholder: Windows 11 24H2 (Build 26100)
    validations:
      required: true
  - type: input
    id: hardware_specs
    attributes:
      label: Hardware Specs (CPU, GPU, RAM)
      description: e.g. Core i3-12100F, RTX 3060, 32GB RAM
      placeholder: Intel Core i5 / NVIDIA RTX 4070
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what happened.
    validations:
      required: true
  - type: textarea
    id: reproduction_steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce the problem?
      placeholder: |
        1. Open 'Overclock' tab
        2. Click 'Start Safe Auto-OC'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
